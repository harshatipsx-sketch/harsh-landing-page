<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAJ FIXER [CRICKET ANALYST]</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0b0f19, #1b263b, #0d1b2a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 440px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #d35400);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.6);
            border: 3px solid #ffffff;
        }

        .logo-box span {
            font-size: 52px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .sub-tag {
            color: #f39c12;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .stats-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #00e676;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 230, 118, 0.3);
        }

        .features {
            text-align: left;
            background: rgba(0, 0, 0, 0.25);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.8;
        }

        .features div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .features i {
            color: #00e676;
            font-size: 15px;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(90deg, #0088cc, #00aaff);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(0, 136, 204, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-telegram:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 136, 204, 0.7);
            background: linear-gradient(90deg, #0099e6, #33bbff);
        }

        .btn-telegram i {
            font-size: 22px;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #a0aec0;
        }

        .footer-note span {
            color: #f39c12;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Logo Section -->
        <div class="logo-box">
            <span>R</span>
        </div>

        <!-- Title -->
        <h1>RAJ FIXER</h1>
        <div class="sub-tag">Cricket Analyst</div>

        <!-- Subscriber Stats -->
        <div class="stats-badge">
            <i class="fa-solid fa-users"></i> 100,000+ Subscribers
        </div>

        <!-- Key Points -->
        <div class="features">
            <div><i class="fa-solid fa-circle-check"></i> Accurate Cricket Match Analysis</div>
            <div><i class="fa-solid fa-circle-check"></i> Daily Match Reports & Updates</div>
            <div><i class="fa-solid fa-circle-check"></i> Best Toss & Session Predictions</div>
        </div>

        <!-- CTA Button with your link -->
        <a href="https://t.me/+VtScpssku7A3YTI1" class="btn-telegram" target="_blank">
            <i class="fa-brands fa-telegram"></i> JOIN TELEGRAM CHANNEL
        </a>

        <!-- Footer / Contact -->
        <div class="footer-note">
            Paid Promotion: <span>@Rajbhai7777</span>
        </div>
    </div>

</body>
</html>
